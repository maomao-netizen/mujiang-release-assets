name: Publish v0.4.7.20 payload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.7.20.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode update package
        run: base64 --decode .release/payload-0.4.7.20.b64 > payload-0.4.7.20.zip

      - name: Verify update package
        run: |
          echo "f1943972d856a74dcd43ed355e55c24d7896fb370892f8df56b4963db99d0edd  payload-0.4.7.20.zip" | sha256sum --check -
          test "$(stat -c%s payload-0.4.7.20.zip)" = "304402"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.7.20 >/dev/null 2>&1; then
            gh release upload v0.4.7.20 payload-0.4.7.20.zip --clobber
          else
            gh release create v0.4.7.20 payload-0.4.7.20.zip \
              --title "Mujiang v0.4.7.20" \
              --notes "新增签名离线宽限期：在线验证成功后允许最长24小时离线使用，并继续校验设备绑定、签名、卡密到期时间和系统时间回拨；修复应用重启后重新弹出登录页的问题。"
          fi
